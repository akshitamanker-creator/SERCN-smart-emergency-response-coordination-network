<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SERCN - Smart Emergency Response Coordination Network</title>
  <meta name="description" content="Centralized AI-Powered Emergency Response Coordination Platform connecting Citizens, Ambulances, Police, Fire, Hospitals, and Volunteers." />
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css" />
  
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Chart.js for Dashboard Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Lucide Icons CDN (SVG rendering helper) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header dynamically injected here -->
    <header id="main-header" class="main-header"></header>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <!-- Dynamic role views are rendered inside this wrapper -->
    </main>

    <!-- Floating Emergency Simulation Bar -->
    <div id="simulation-bar-container"></div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Auth Modal Container -->
    <div id="auth-modal-container"></div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
